services:
  mongo:
    image: mongo:7.0.43
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}) }; if (!db.hello().isWritablePrimary) quit(1)' "]
      interval: 3s
      timeout: 5s
      retries: 30
  bench:
    build: .
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ${ARGON_ENGINE_SOURCE:?Set ARGON_ENGINE_SOURCE to an explicit Argon checkout}:/engine:ro
      - ./results:/suite/results
