name: Benchmark CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ARGON_ENGINE_REF: ba6e06a9a3b31124d6c37475b5667dd70ab42379
  ARGON_SUITE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  workflow-smoke:
    name: Unit tests and replica-set workflow smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: suite
    steps:
      - name: Check out exact suite revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.ARGON_SUITE_REF }}
          path: suite
          fetch-depth: 0
          persist-credentials: false

      # Keep the engine outside the suite: run.py inventories suite source
      # files, so a nested engine checkout would pollute that inventory.
      - name: Check out fixed companion engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: argon-lab/argon
          ref: ${{ env.ARGON_ENGINE_REF }}
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: Configure isolated Compose fixture
        run: |
          echo "ARGON_ENGINE_SOURCE=$GITHUB_WORKSPACE/engine" >> "$GITHUB_ENV"
          mkdir -p results

      - name: Validate and build the Go 1.26.6 container recipe
        run: |
          docker compose config --quiet
          docker compose build bench

      - name: Start MongoDB replica set
        run: docker compose up --detach --wait --wait-timeout 120 mongo

      # run.py runs all Go unit tests before building the executable, then
      # freezes both sources and records the exact engine ref and Go version.
      - name: Run unit tests and one-cell correctness smoke
        run: |
          docker compose run --rm --no-deps bench \
            --ref "$ARGON_ENGINE_REF" --results /suite/results/ci-smoke -- \
            -sizes 100 -concurrency 1 -depths 1 \
            -metadata-samples 2 -workflow-samples 2 -read-samples 2 \
            -divergence-docs 3 -divergence-rounds 2 -timeout 3m \
            2>&1 | tee results/smoke.log

      - name: Verify recorded source and toolchain
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('results/ci-smoke/raw.json').read_text())
          assert report['complete']
          assert report['provenance']['engine']['git_head'] == os.environ['ARGON_ENGINE_REF']
          assert report['provenance']['suite']['git_head'] == os.environ['ARGON_SUITE_REF']
          assert not report['provenance']['engine']['dirty']
          assert not report['provenance']['suite']['dirty']
          assert report['environment']['go'] == 'go1.26.6'
          assert len(report['scenarios']) == 1
          scenario = report['scenarios'][0]
          assert (scenario['documents'], scenario['concurrency'], scenario['ancestry_depth']) == (100, 1, 1)
          assert scenario['storage']['captured_records'] == 6
          print('Exact source/toolchain provenance and six captured updates verified.')
          print('This correctness smoke has no latency/throughput SLA assertions.')
          PY

      - name: Collect fixture logs and remove containers
        if: always()
        run: |
          mkdir -p results
          docker compose logs --no-color > results/compose.log 2>&1 || true
          docker compose down --volumes --remove-orphans

      - name: Retain raw smoke samples, provenance, source archives and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: suite/results/
          if-no-files-found: warn
          retention-days: 14
